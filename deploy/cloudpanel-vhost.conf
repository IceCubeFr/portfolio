# Configuration à ajouter dans l'éditeur de Vhost CloudPanel
# (CloudPanel > Sites > votre site > Vhost).
#
# À insérer dans le second bloc "server" (celui qui contient {{root}}),
# juste après la ligne "index index.html;".
# Ne pas l'ajouter dans le premier bloc server qui sert à la redirection HTTP -> HTTPS.
#
# CloudPanel utilise Nginx : sans cette règle, un rechargement direct sur
# /anciennes-versions renvoie une 404 puisque ce fichier n'existe pas.
# La SPA a besoin de recevoir index.html pour toutes les routes inconnues.

location / {
    try_files $uri $uri/ /index.html;
}

# index.html référence les assets versionnés : il ne doit pas être mis en cache.
location = /index.html {
    add_header Cache-Control "no-cache";
}

# Les fichiers produits par Vite dans /assets/ sont hashés : cache long possible.
location ^~ /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
}
